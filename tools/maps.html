<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NullMaps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; font-family:Lato, sans-serif; background:#000; color:#fff; }
  #map { flex:1; }
  #controls { padding:8px; background:#111; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, button { padding:6px; background:#222; color:#fff; border:1px solid #fff; border-radius:4px; }
  #markerList { max-height:150px; overflow-y:auto; margin-top:4px; font-size:12px; }
</style>
</head>
<body>
<div id="controls">
  <button id="exportMarkers">Copy Markers JSON</button>
  <input type="text" id="searchInput" placeholder="Search location">
  <button id="searchBtn">Search</button>
  <div id="markerList"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
// Initialize map
const map = L.map('map').setView([0, 0], 2);

// Tile layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Marker array
const markers = [];

// Add marker on map click
map.on('click', e => {
  const title = prompt("Enter marker title:");
  if (title === null) return; // cancelled
  const marker = L.marker(e.latlng).addTo(map).bindPopup(title);
  markers.push({lat:e.latlng.lat, lng:e.latlng.lng, title});
  updateMarkerList();
});

// Export markers JSON
document.getElementById('exportMarkers').addEventListener('click', () => {
  const json = JSON.stringify(markers, null, 2);
  navigator.clipboard.writeText(json).then(()=>alert("Markers copied to clipboard!"));
});

// Marker list
const markerListDiv = document.getElementById('markerList');
function updateMarkerList() {
  markerListDiv.innerHTML = markers.map((m,i)=>`${i+1}. ${m.title} (${m.lat.toFixed(4)}, ${m.lng.toFixed(4)})`).join('<br>');
}

// Simple search via Nominatim
document.getElementById('searchBtn').addEventListener('click', async () => {
  const query = document.getElementById('searchInput').value;
  if(!query) return;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if(data.length===0){ alert("Location not found"); return; }
    const loc = data[0];
    map.setView([parseFloat(loc.lat), parseFloat(loc.lon)], 12);
  } catch(e){ console.error(e); alert("Search failed"); }
});
  });
</script>
</body>
</html>
