<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NullMaps Pro+Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; font-family:Lato, sans-serif; background:#000; color:#fff; }
  #map { flex:1; }
  #controls { padding:8px; background:#111; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, button { padding:6px; background:#222; color:#fff; border:1px solid #fff; border-radius:4px; }
  #markerList { max-height:150px; overflow-y:auto; margin-top:4px; font-size:12px; }
  #speedDisplay { margin-left:10px; font-weight:bold; }
</style>
</head>
<body>
<div id="controls">
  <button id="exportMarkers">Copy Markers JSON</button>
  <input type="text" id="searchInput" placeholder="Search location">
  <button id="searchBtn">Search</button>
  <button id="locBtn">Start Live Location</button>
  <button id="dirBtn">Set Directions</button>
  <span id="speedDisplay">Speed Limit: N/A | Your Speed: N/A km/h</span>
  <div id="markerList"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const map = L.map('map').setView([0,0], 2);

  // Tile layers
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'ESRI' });
  streets.addTo(map);
  L.control.layers({ "Streets": streets, "Satellite": satellite }).addTo(map);

  // Markers
  const markers = [];
  const markerListDiv = document.getElementById('markerList');
  function updateMarkerList() {
    markerListDiv.innerHTML = markers.map((m,i)=>`${i+1}. ${m.title} (${m.lat.toFixed(4)}, ${m.lng.toFixed(4)})`).join('<br>');
  }
  map.on('click', e => {
    const title = prompt("Enter marker title:");
    if(title===null) return;
    L.marker(e.latlng).addTo(map).bindPopup(title);
    markers.push({lat:e.latlng.lat, lng:e.latlng.lng, title});
    updateMarkerList();
  });
  document.getElementById('exportMarkers').addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(markers, null, 2)).then(()=>alert("Markers copied!"));
  });

  // Speed limit & user speed
  const speedDisplay = document.getElementById('speedDisplay');
  async function updateSpeedLimit(lat, lng){
    try {
      const query = `[out:json];way(around:50,${lat},${lng})[maxspeed];out;`;
      const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
      const data = await res.json();
      if(data.elements.length>0 && data.elements[0].tags.maxspeed){
        return data.elements[0].tags.maxspeed;
      }
      return "N/A";
    } catch(e){ return "N/A"; }
  }

  // Live location tracking
  let userMarker, watchId;
  document.getElementById('locBtn').addEventListener('click', () => {
    if(navigator.geolocation){
      if(watchId) { navigator.geolocation.clearWatch(watchId); watchId=null; alert("Live location stopped."); return; }
      watchId = navigator.geolocation.watchPosition(async pos => {
        const { latitude, longitude, speed } = pos.coords;
        if(!userMarker){
          userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("You").openPopup();
        } else userMarker.setLatLng([latitude, longitude]);
        map.setView([latitude, longitude], 16);
        const limit = await updateSpeedLimit(latitude, longitude);
        const kmh = speed ? (speed*3.6).toFixed(1) : "N/A";
        speedDisplay.textContent = `Speed Limit: ${limit} | Your Speed: ${kmh} km/h`;
      }, err => alert("Unable to get live location"), { enableHighAccuracy:true, maximumAge:1000 });
      alert("Live location started. Click the button again to stop.");
    } else alert("Geolocation not supported.");
  });

  // Directions
  let routingControl;
  document.getElementById('dirBtn').addEventListener('click', () => {
    if(routingControl) map.removeControl(routingControl);
    alert("Click start and end markers for route");
    const points = [];
    const clickHandler = e => {
      points.push(e.latlng);
      L.marker(e.latlng).addTo(map).bindPopup(points.length===1?"Start":"End").openPopup();
      if(points.length===2){
        routingControl = L.Routing.control({ waypoints: points, routeWhileDragging: true }).addTo(map);
        map.off('click', clickHandler);
      }
    };
    map.on('click', clickHandler);
  });

  // Search (LocationIQ)
  const locIQKey = "pk.60fb9d576b3af312a1118708e66c1d62"; // get free key
  document.getElementById('searchBtn').addEventListener('click', async () => {
    const query = document.getElementById('searchInput').value;
    if(!query) return;
    try {
      const res = await fetch(`https://us1.locationiq.com/v1/search.php?key=${locIQKey}&q=${encodeURIComponent(query)}&format=json`);
      const data = await res.json();
      if(data.length===0){ alert("Location not found"); return; }
      const loc = data[0];
      map.setView([parseFloat(loc.lat), parseFloat(loc.lon)], 16);
      L.marker([parseFloat(loc.lat), parseFloat(loc.lon)]).addTo(map).bindPopup(loc.display_name).openPopup();
    } catch(e){ console.error(e); alert("Search failed"); }
  });

});
</script>
</body>
</html>
