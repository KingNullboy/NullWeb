<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NullMaps Enhanced</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; font-family:Lato, sans-serif; background:#000; color:#fff; }
  #map { flex:1; }
  #controls { padding:8px; background:#111; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, button { padding:6px; background:#222; color:#fff; border:1px solid #fff; border-radius:4px; }
  #markerList { max-height:150px; overflow-y:auto; margin-top:4px; font-size:12px; }
  #speedDisplay { margin-left:10px; font-weight:bold; }
  #policeAlerts { margin-top:10px; font-size:14px; color:#ff0000; }
</style>
</head>
<body>
<div id="controls">
  <button id="exportMarkers">Copy Markers JSON</button>
  <input type="text" id="searchInput" placeholder="Search location">
  <button id="searchBtn">Search</button>
  <button id="locBtn">Start Live Location</button>
  <button id="dirBtn">Set Directions</button>
  <span id="speedDisplay">Speed Limit: N/A | Your Speed: N/A mph</span>
  <div id="markerList"></div>
  <div id="policeAlerts">Alerts: None</div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

  const map = L.map('map').setView([0,0],2);

  // Tile layers
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'ESRI' });
  streets.addTo(map);
  L.control.layers({"Streets": streets, "Satellite": satellite}).addTo(map);

  // Marker handling
  const markers = [];
  const markerListDiv = document.getElementById('markerList');
  map.on('click', e => {
    const title = prompt("Enter marker title:");
    if (!title) return;
    L.marker(e.latlng).addTo(map).bindPopup(title);
    markers.push({lat:e.latlng.lat,lng:e.latlng.lng,title});
    updateMarkerList();
  });
  document.getElementById('exportMarkers').addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(markers,null,2)).then(()=>alert("Markers copied!"));
  });
  function updateMarkerList(){
    markerListDiv.innerHTML = markers.map((m,i)=>`${i+1}. ${m.title} (${m.lat.toFixed(4)},${m.lng.toFixed(4)})`).join('<br>');
  }

  // Search (LocationIQ)
  const locIQKey = "pk.60fb9d576b3af312a1118708e66c1d62";
  document.getElementById('searchBtn').addEventListener('click', async ()=>{
    const query = document.getElementById('searchInput').value;
    if(!query) return;
    try {
      const res = await fetch(`https://us1.locationiq.com/v1/search.php?key=${locIQKey}&q=${encodeURIComponent(query)}&format=json`);
      const data = await res.json();
      if(data.length===0){alert("Location not found"); return;}
      const loc = data[0];
      map.setView([parseFloat(loc.lat),parseFloat(loc.lon)],16);
      L.marker([parseFloat(loc.lat),parseFloat(loc.lon)]).addTo(map).bindPopup(loc.display_name).openPopup();
    }catch(e){console.error(e); alert("Search failed");}
  });

  // Directions
  let routingControl;
  document.getElementById('dirBtn').addEventListener('click', () => {
    if(routingControl) map.removeControl(routingControl);
    alert("Click start and end markers for route");
    const points=[];
    const clickHandler = e=>{
      points.push(e.latlng);
      L.marker(e.latlng).addTo(map).bindPopup(points.length===1?"Start":"End").openPopup();
      if(points.length===2){
        routingControl = L.Routing.control({waypoints:points, routeWhileDragging:true}).addTo(map);
        map.off('click',clickHandler);
      }
    };
    map.on('click',clickHandler);
  });

  // Police Alerts (dummy API placeholder, replace with real API & key)
  const policeAlertsDiv = document.getElementById('policeAlerts');
  async function fetchPoliceAlerts(lat,lon){
    try{
      const res = await fetch(`https://api.rekor.ai/incidents?lat=${lat}&lng=${lon}&radius=1000`, {headers:{'Authorization':'Bearer YOUR_API_KEY'}});
      const data = await res.json();
      if(data.incidents && data.incidents.length>0){
        const alerts = data.incidents.map(i=>`Police activity at ${i.location} (${i.type})`).join('<br>');
        policeAlertsDiv.innerHTML = `Alerts:<br>${alerts}`;
      }else policeAlertsDiv.innerHTML='Alerts: None';
    }catch(e){console.error(e); policeAlertsDiv.innerHTML='Alerts: Error';}
  }

  // TomTom Traffic + Speed Limit
  const tomTomApiKey = 'TdcCkY3GJQm5HAROLqYD3pOE0cpgKvLp';
  async function fetchSpeedLimit(lat, lon){
    try{
      const res = await fetch(`https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${lat},${lon}&unit=MPH&key=${tomTomApiKey}`);
      const data = await res.json();
      if(data.flowSegmentData && data.flowSegmentData.freeFlowSpeed) return data.flowSegmentData.freeFlowSpeed;
    }catch(e){console.error("Error fetching speed limit",e);}
    return null;
  }

  async function fetchTrafficIncidents(lat, lon){
    try{
      const res = await fetch(`https://api.tomtom.com/traffic/services/4/incidentDetails?bbox=${lat-0.05},${lon-0.05},${lat+0.05},${lon+0.05}&key=${tomTomApiKey}`);
      const data = await res.json();
      if(data.incidents && data.incidents.length>0){
        const incidents = data.incidents.map(i=>`${i.type} on ${i.roadName} (${i.delayInMinutes} min delay)`).join('<br>');
        policeAlertsDiv.innerHTML = `Traffic & Alerts:<br>${incidents}`;
      }
    }catch(e){console.error('Error fetching traffic incidents',e);}
  }

  // Live Location
  let userMarker, watchId;
  document.getElementById('locBtn').addEventListener('click',()=>{
    if(!navigator.geolocation){alert("Geolocation not supported."); return;}
    if(watchId){navigator.geolocation.clearWatch(watchId); watchId=null; alert("Live location stopped."); return;}
    watchId = navigator.geolocation.watchPosition(async pos=>{
      const {latitude,longitude,speed} = pos.coords;
      if(!userMarker) userMarker=L.marker([latitude,longitude]).addTo(map).bindPopup("You").openPopup();
      else userMarker.setLatLng([latitude,longitude]);
      map.setView([latitude,longitude],16);

      const yourSpeed = speed ? (speed*2.23694).toFixed(1) : "N/A"; // m/s to mph
      const limit = await fetchSpeedLimit(latitude,longitude) || "N/A";
      document.getElementById('speedDisplay').textContent=`Speed Limit: ${limit} mph | Your Speed: ${yourSpeed} mph`;

      await fetchPoliceAlerts(latitude,longitude);
      await fetchTrafficIncidents(latitude,longitude);

    }, err=>alert("Unable to get live location"), {enableHighAccuracy:true, maximumAge:1000});
    alert("Live location started. Click again to stop.");
  });

});
</script>
</body>
</html>
