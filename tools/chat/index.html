<!DOCTYPE html>
<html>
	<head>
		<title>NullChat</title>
		<script src="/js/main.js"></script>
		<script src="https://iframe.chat/scripts/main.min.js"></script>
		<script>
			chattable.initialize({
				stylesheet: "chattable.css"
			});
		</script>
        <style>
        /* Make html and body take full height */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Make the iframe fill the viewport */
        #chattable {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
	</head>
	<body>
		<iframe src="https://iframe.chat/embed?chat=NullChat" id="chattable" width=100% height=100%></iframe>
	</body>
</html>
