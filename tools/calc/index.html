<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NullMath</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
<script src="/js/main.js"></script>
</head>
<body>

<div id="nullmath">
    <h1>NullMath</h1>
    <!-- Tabs -->
    <div id="tabs">
        <button class="tab-btn active" data-tab="calc">Calculator</button>
        <button class="tab-btn" data-tab="graph">Graph</button>
        <button class="tab-btn" data-tab="base">Base Conv</button>
        <button class="tab-btn" data-tab="matrix">Matrices/Lists</button>
        <button class="tab-btn" data-tab="stats">Statistics</button>
    </div>

    <!-- Tab contents -->
    <div id="tab-contents">
        <!-- Calculator -->
        <div class="tab-content active" id="calc">
            <div id="calc-display">
                <div id="calc-prev">ANS: 0</div>
                <div id="calc-current">0</div>
            </div>
            <div id="calc-buttons"></div>
        </div>

        <!-- Graphing -->
        <div class="tab-content" id="graph">
            <input type="text" id="graph-func" placeholder="Enter functions e.g., sin(x), x^2">
            <canvas id="graph-canvas" width="500" height="300"></canvas>
        </div>

        <!-- Base Conversion -->
        <div class="tab-content" id="base">
            <label>Decimal: <input type="number" id="base-dec"></label>
            <label>Binary: <input type="text" id="base-bin"></label>
            <label>Hex: <input type="text" id="base-hex"></label>
            <label>Octal: <input type="text" id="base-oct"></label>
        </div>

        <!-- Matrices/Lists -->
        <div class="tab-content" id="matrix">
            <textarea id="matrix-input" rows="8" placeholder="Enter matrix or list, comma-separated"></textarea>
            <button id="matrix-add">Add</button>
            <button id="matrix-mul">Multiply</button>
            <button id="matrix-det">Determinant</button>
            <pre id="matrix-output"></pre>
        </div>

        <!-- Statistics -->
        <div class="tab-content" id="stats">
            <textarea id="stats-input" rows="6" placeholder="Enter list of numbers, comma-separated"></textarea>
            <button id="stats-mean">Mean</button>
            <button id="stats-std">Std Dev</button>
            <pre id="stats-output"></pre>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
