<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NullEditor</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/theme/dracula.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar">
            <div id="sidebarHeader">
                <button id="newFileBtn">New File</button>
                <button id="newFolderBtn">New Folder</button>
                <button id="togglePreview">Toggle Preview</button>
                <button id="extensionsBtn">Extensions</button>
                <button id="newConsoleBtn">New Console</button>
            </div>
            <ul id="fileTree"></ul>
            <div id="extensionsPanel"
                style="display:none; padding:5px; overflow-y:auto; flex:1; border-top:2px solid #fff;">
                <h4>Extensions</h4>
                <div id="extensionsList"></div>
            </div>
        </div>

        <!-- Main area -->
        <div id="mainArea">
            <div id="editorToolbar">
                <label for="highlightLang">Highlight text as:</label>
                <select id="highlightLang">
                    <option value="">--Select--</option>
                    <option value="javascript">JavaScript</option>
                    <option value="htmlmixed">HTML</option>
                    <option value="css">CSS</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="json">JSON</option>
                    <option value="markdown">Markdown</option>
                </select>
                <label for="formatLang">Format text as:</label>
                <select id="formatLang">
                    <option value="">--Select--</option>
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="json">JSON</option>
                    <option value="markdown">Markdown</option>
                </select>
            </div>

            <div id="editorPreviewContainer">
                <textarea id="editor" placeholder="Start typing..."></textarea>
                <iframe id="preview"></iframe>
            </div>

            <!-- Console Panels -->
            <div id="consoleContainer"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu">
        <ul>
            <li id="renameFile">Rename</li>
            <li id="deleteFile">Delete</li>
            <li id="downloadFile">Download</li>
            <li id="uploadFile">Upload File(s)</li>
            <li id="uploadFolder">Upload Folder</li>
            <li id="copyFile">Copy</li>
            <li id="cutFile">Cut</li>
            <li id="pasteFile">Paste</li>
        </ul>
    </div>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/xml/xml.min.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/standalone.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/estree.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/babel.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/html.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/postcss.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/json.js"></script>
    <script src="https://unpkg.com/prettier@3.6.2/plugins/markdown.js"></script>
    <script src="https://www.null-web.vastserve.com/js/md+.js"></script>

    <script src="script.js"></script>
</body>

</html>
