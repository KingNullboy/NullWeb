<!DOCTYPE HTML>
<html lang="en" style="--bg-color: #000000; --text-color: #ffffff; --border-color: #ffffff; --font-family: Lato;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>NullWeb</title>

    <!-- Meta description for search engines -->
    <meta name="description" content="Explore NullWeb, your hub for NullMedia, NullWiki, NullLinks, NullG*mes, and NullTools. Fun, facts, and useful apps all in one place.">

    <!-- Open Graph for search engines and social shares -->
    <meta property="og:title" content="NullWeb - Social Media, Wiki, Games & Tools">
    <meta property="og:description" content="Explore NullWeb, your hub for NullMedia, NullWiki, NullLinks, NullG*mes, and NullTools. Fun, facts, and useful apps all in one place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.null-web.vastserve.com/">
    <meta property="og:image" content="https://www.null-web.vastserve.com/logo.png">

    <!-- Twitter card -->
    <meta name="twitter:title" content="NullWeb - Social Media, Wiki, Games & Tools">
    <meta name="twitter:description" content="Explore NullWeb, your hub for NullMedia, NullWiki, NullLinks, NullG*mes, and NullTools. Fun, facts, and useful apps all in one place.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.null-web.vastserve.com/logo.png">

	<link rel="preload" href="styles.css" as="style">
	<link rel="preload" href="logo.png" as="image">
	<link rel="manifest" href="/manifest.json">

    <!-- Apple & mobile web app settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Caching & offline -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Scripts -->
    <script src="/styles.js" defer></script>
    <script src="openblank.js" defer></script>
    <script src="iosapp.js" defer></script>
    <script src="portraittext.js" defer></script>
    <script src="/js/main.js" defer></script>
    <script src="facts.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/offline-sw.js');
        }

        // 1 in 50 chance redirect
        if (Math.floor(Math.random() * 50) === 0) {
            window.location.href = "/tools/nsfw/?instant=true";
        }
    </script>
</head>
<body>
    <main role="main" style="text-align:center;">
        <header>
            <h1>NullWeb</h1>
            <p>Your hub for fun, games, social media, and useful tools.</p>
        </header>

        <nav aria-label="Main navigation">
            <button class="navbtn" onclick="window.location = 'socialmedia/';" title="Visit NullMedia" role="link">
                <img src="socialmedia/logo.png" alt="NullMedia logo" width="40"><br>NullMedia
            </button>
            <button class="navbtn" onclick="window.location = 'wiki/';" title="Visit NullWiki" role="link">
                <img src="wiki/logo.png" alt="NullWiki logo" width="40"><br>NullWiki
            </button>
            <button class="navbtn" onclick="window.location = 'links/';" title="Visit NullLinks" role="link">
                <img src="links/logo.png" alt="NullLinks logo" width="40"><br>NullLinks
            </button>
            <button class="navbtn" onclick="window.location = 'gxmes/';" title="Visit NullG*mes" role="link">
                <img src="gxmes/logo.png" alt="NullG*mes logo" width="40"><br>NullG*mes
            </button>
            <button class="navbtn" onclick="window.location = 'tools/';" title="Visit NullTools" role="link">
                <img src="tools/logo.png" alt="NullTools logo" width="30"><br>NullTools
            </button>
        </nav>

        <section aria-label="Fun facts">
            <p id="homepageFact" style="cursor:pointer; margin-top:20px;">[loading a weird truth... click me!]</p>
        </section>

        <section aria-label="Utilities">
            <button id="openBlankLink" class="botbtn" title="Hide URL">Hide URL</button>
            <button class="botbtn" onclick="window.location.href='styles.html';" title="Change Themes">Themes</button>
            <button class="botbtn" onclick="window.open('qrcode.png');" title="View QR Code">QR Code</button>
            <button class="botbtn" onclick="window.location.href='contact.html';" title="Contact NullWeb">Contact Us</button>
        </section>

        <section aria-label="App downloads">
            <button id="installButton" class="botbtn" onclick="generateProfile();" style="display:none;" title="Download iOS App">Download iOS App</button>
            <button id="androidDownloadButton" class="botbtn" onclick="alert('To use the Android app, look up how to install apk files.'); window.location.href = 'NullWeb_App.apk';" style="display:none;" title="Download Android App">Download Android App</button>
        </section>
    </main>
</body>
</html>
