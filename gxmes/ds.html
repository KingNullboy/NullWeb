<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadshot.io</title>
    <style>
        /* Remove default margins/padding and ensure full viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000; /* optional background color */
        }

        /* Fullscreen object */
        object {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <object data="https://deadshot.io/" type="text/html"></object>
</body>
</html>
