<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find A Place - Duel Edition</title>
<style>
:root {
    --bg: #0f172a;
    --panel-bg: #1e293b;
    --accent: #38bdf8;
    --box-border: #334155;
    --text: #f8fafc;
    --game1: #818cf8;
    --game2: #f472b6;
    --locked: 0.2;
}

.light-mode {
    --bg: #f1f5f9;
    --panel-bg: #ffffff;
    --accent: #0284c7;
    --box-border: #cbd5e1;
    --text: #0f172a;
    --locked: 0.15;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.3s, color 0.3s;
}

.setup-container {
    background: var(--panel-bg);
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    margin-bottom: 30px;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.game-controls {
    display: none;
    flex-direction: column;
    align-items: center;
}

.digit-display-box {
    background: var(--panel-bg);
    padding: 10px 30px;
    border-radius: 50px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#current { font-size: 2.2rem; font-weight: 800; color: var(--accent); min-width: 45px; text-align: center; }

.seed-banner {
    font-size: 0.7rem;
    opacity: 0.6;
    margin-bottom: 20px;
    font-family: monospace;
}

.headers { display: flex; gap: 140px; margin-bottom: 15px; font-weight: bold; }

#board { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }

.box {
    width: 42px; height: 42px; background: var(--panel-bg);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--box-border); border-radius: 8px;
    cursor: pointer; font-weight: bold; transition: all 0.2s;
}

.box:hover:not(.locked) { border-color: var(--accent); transform: scale(1.05); }

.row-score { width: 55px; font-size: 0.75rem; text-align: center; font-weight: bold; color: var(--accent); }
.center { width: 75px; background: var(--text); color: var(--bg); border: none; cursor: default; }
.side { display: flex; gap: 5px; min-width: 185px; justify-content: flex-end; }
.side.right { justify-content: flex-start; }
.side.locked { opacity: var(--locked); pointer-events: none; }

.scoreboard {
    margin-top: 30px; background: var(--panel-bg);
    padding: 20px; border-radius: 16px; min-width: 280px;
}

.stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; }
.total-line { border-top: 2px solid var(--box-border); padding-top: 10px; font-weight: 800; font-size: 1.3rem; }

button {
    padding: 12px 20px; background: var(--accent); border: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; color: white;
}

input {
    padding: 10px; border-radius: 8px; border: 1px solid var(--box-border);
    background: var(--bg); color: var(--text); flex-grow: 1;
}

.button-group { display: flex; gap: 10px; }
.secondary { background: #64748b; }

#history-list { font-size: 0.8rem; list-style: none; padding: 0; margin-top: 10px; }
#history-list li { 
    padding: 8px; border-bottom: 1px solid var(--box-border); 
    cursor: pointer; opacity: 0.8; border-radius: 4px;
}
#history-list li:hover { background: rgba(0,0,0,0.1); opacity: 1; }
</style>
</head>
<body>

<h2>Find A Place</h2>

<div id="setupMenu" class="setup-container">
    <div style="display:flex; justify-content: space-between; align-items:center;">
        <h3 style="margin:0">Game Setup</h3>
        <button class="secondary" onclick="toggleTheme()" style="padding: 5px 10px; font-size: 0.8rem;">🌓 Theme</button>
    </div>
    
    <input type="text" id="seedInput" placeholder="Enter custom seed or leave blank for random">

    <div class="button-group">
        <button onclick="startGame()" style="flex:2">Start New Game</button>
        <button id="resumeBtn" onclick="resumeGame()" class="secondary" style="flex:1; display:none;">Resume</button>
    </div>

    <div id="historySection">
        <p style="font-size: 0.7rem; margin-bottom: 0; opacity: 0.6;">Recent Seeds:</p>
        <ul id="history-list"></ul>
    </div>
</div>

<div id="gameUI" class="game-controls">
    <div class="digit-display-box">
        <button onclick="generateDigit()">GENERATE</button>
        <span id="current"></span>
    </div>
    <div class="seed-banner">Seed: <span id="activeSeedDisplay"></span></div>

    <div class="headers">
        <span class="g1-text">GAME 1</span>
        <span id="labelG2" class="g2-text" style="opacity:0.3">GAME 2</span>
    </div>

    <div id="board"></div>

    <div class="scoreboard">
        <div class="stat-line"><span>Game 1 Score:</span> <span id="scoreG1" class="g1-text">0</span></div>
        <div class="stat-line"><span>Game 2 Score:</span> <span id="scoreG2" class="g2-text">0</span></div>
        <div class="stat-line total-line"><span>TOTAL:</span> <span id="total">0</span></div>
        <button onclick="exitToMenu()" class="secondary" style="width:100%; margin-top:15px; font-size:0.8rem">Quit to Menu</button>
    </div>
</div>

<script>
let state = {
    currentDigit: null,
    rows: [],
    g1Total: 0,
    g2Total: 0,
    seed: null,
    seedNum: 0,
    rngPos: 0, // Track how many digits pulled for determinism
    game1Complete: false,
    active: false
};

// --- INITIALIZATION ---
if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
renderHistory();
if(localStorage.getItem('findAPlace_save')) document.getElementById('resumeBtn').style.display = 'block';

function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// --- CORE GAME ENGINE ---

function startGame() {
    let inputField = document.getElementById('seedInput');
    let finalSeed = inputField.value.trim();
    
    if(!finalSeed) {
        finalSeed = Math.floor(Math.random() * 1000000).toString();
        inputField.value = finalSeed;
    }
    
    saveHistory(finalSeed);
    setupGameState(finalSeed);
    saveGame();
    showUI();
    render();
}

function setupGameState(seed) {
    state.seed = seed;
    // Map seed string to a numeric value for calculations
    state.seedNum = seed.split('').reduce((a,b)=>a+b.charCodeAt(0), 0);
    state.rngPos = 0;
    state.currentDigit = null;
    state.g1Total = 0;
    state.g2Total = 0;
    state.game1Complete = false;
    state.active = true;

    document.getElementById('activeSeedDisplay').innerText = seed;

    // Seed-based random target for final row
    const randomTarget = Math.floor((Math.abs(Math.sin(state.seedNum)) * 9000)) + 1000;

    state.rows = [
        {len:1, t:0}, {len:2, t:10}, {len:2, t:50}, {len:2, t:75}, {len:2, t:100},
        {len:3, t:100}, {len:3, t:500}, {len:3, t:800}, {len:3, t:1000}, {len:4, t:randomTarget}
    ].map(r => ({
        left: Array(r.len).fill(null),
        right: Array(r.len).fill(null),
        target: r.t,
        diffL: null,
        diffR: null
    }));
}

function generateDigit() {
    if(state.currentDigit !== null) return;
    
    // Deterministic PRNG formula using seed + position
    let x = Math.sin(state.seedNum + state.rngPos) * 10000;
    state.currentDigit = Math.floor((x - Math.floor(x)) * 10);
    state.rngPos++; // Ensure next pull is different but repeatable
    
    document.getElementById('current').innerText = state.currentDigit;
    saveGame();
}

function place(rowIndex, side, index) {
    if(state.currentDigit === null) return;
    if(side === 'R' && !state.game1Complete) return;

    let r = state.rows[rowIndex];
    if(side === 'L' ? r.left[index] !== null : r.right[index] !== null) return;

    side === 'L' ? r.left[index] = state.currentDigit : r.right[index] = state.currentDigit;
    state.currentDigit = null;
    document.getElementById('current').innerText = '';
    
    calculateProgress();
    saveGame();
    render();
}

// --- UTILS & UI ---

function calculateProgress() {
    state.g1Total = 0; state.g2Total = 0;
    let allG1Done = true;

    state.rows.forEach(r => {
        if(r.left.every(x => x !== null)) {
            r.diffL = Math.abs(parseInt(r.left.join('')) - r.target);
            state.g1Total += r.diffL;
        } else { allG1Done = false; }
        
        if(r.right.every(x => x !== null)) {
            r.diffR = Math.abs(parseInt(r.right.join('')) - r.target);
            state.g2Total += r.diffR;
        }
    });

    state.game1Complete = allG1Done;
    updateScoreDisplay();
}

function updateScoreDisplay() {
    document.getElementById('scoreG1').innerText = state.g1Total;
    document.getElementById('scoreG2').innerText = state.g2Total;
    document.getElementById('total').innerText = state.g1Total + state.g2Total;
    document.getElementById('labelG2').style.opacity = state.game1Complete ? "1" : "0.3";
}

function saveGame() {
    localStorage.setItem('findAPlace_save', JSON.stringify(state));
}

function resumeGame() {
    const saved = JSON.parse(localStorage.getItem('findAPlace_save'));
    if(saved) {
        state = saved;
        showUI();
        render();
        updateScoreDisplay();
        if(state.currentDigit !== null) document.getElementById('current').innerText = state.currentDigit;
        document.getElementById('activeSeedDisplay').innerText = state.seed;
    }
}

function saveHistory(seed) {
    let history = JSON.parse(localStorage.getItem('findAPlaceHistory') || '[]');
    if (!history.includes(seed)) {
        history.unshift(seed);
        history = history.slice(0, 5);
        localStorage.setItem('findAPlaceHistory', JSON.stringify(history));
    }
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('history-list');
    const history = JSON.parse(localStorage.getItem('findAPlaceHistory') || '[]');
    list.innerHTML = history.map(s => `<li onclick="document.getElementById('seedInput').value='${s}'">Seed: ${s}</li>`).join('');
}

function showUI() {
    document.getElementById('setupMenu').style.display = 'none';
    document.getElementById('gameUI').style.display = 'flex';
}

function exitToMenu() {
    document.getElementById('setupMenu').style.display = 'flex';
    document.getElementById('gameUI').style.display = 'none';
    document.getElementById('resumeBtn').style.display = 'block';
}

function render() {
    let board = document.getElementById('board');
    board.innerHTML = '';
    state.rows.forEach((r, i) => {
        let div = document.createElement('div');
        div.className = 'row';
        
        let s1 = document.createElement('div');
        s1.className = 'side';
        r.left.forEach((v, idx) => {
            let b = document.createElement('div'); b.className = 'box';
            b.innerText = v ?? ''; b.onclick = () => place(i, 'L', idx);
            s1.appendChild(b);
        });
        
        let sc1 = document.createElement('div');
        sc1.className = 'row-score'; sc1.innerText = r.diffL !== null ? `Δ ${r.diffL}` : '';
        
        let c = document.createElement('div');
        c.className = 'box center'; c.innerText = r.target;
        
        let sc2 = document.createElement('div');
        sc2.className = 'row-score'; sc2.innerText = r.diffR !== null ? `Δ ${r.diffR}` : '';
        
        let s2 = document.createElement('div');
        s2.className = 'side right' + (!state.game1Complete ? ' locked' : '');
        r.right.forEach((v, idx) => {
            let b = document.createElement('div'); b.className = 'box';
            b.innerText = v ?? ''; b.onclick = () => place(i, 'R', idx);
            s2.appendChild(b);
        });

        div.append(s1, sc1, c, sc2, s2);
        board.appendChild(div);
    });
}
</script>
</body>
</html>
