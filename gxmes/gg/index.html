<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>GAMBLING — 99% of gamblers quit before they win big! — THIS IS NOT REAL</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<h1>🎰 SLOT MACHINE 🎰</h1>

	<p id="money"></p>
	<div id="slots"></div>
	<button id="spin">SPIN ($50)</button>
	<button id="reset">RESET</button>
	<p id="result"></p>

	<div class="panel">
		<h2>📊 Stats</h2>
		<div id="stats"></div>
	</div>

	<!-- Popup buttons -->
	<div style="margin-top:20px;">
		<button id="openTechTree">🛠 Tech Tree</button>
		<button id="openAchievements">🏆 Achievements</button>
		<button id="exportSave">Export Save</button>
		<button id="importSave">Import Save</button>
		<input type="file" id="importFile" style="display:none" />
	</div>
	
	<!-- Tech Tree popup -->
	<div id="techTreePopup" class="popup">
	    <div class="popupContent techTreeContainer">
	        <h2>⚙️ Tech Tree</h2>
	        <div id="techTree"></div>
		    <button class="closePopup">Close</button>
		</div>
	</div>

	<!-- Achievements popup -->
	<div id="achievementsPopup" class="popup">
		<div class="popupContent">
			<h2>🏆 Achievements</h2>
			<div id="achievements"></div>
			<button class="closePopup">Close</button>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
