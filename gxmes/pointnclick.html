<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Point and Click — The Maze</title>

  <script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython_stdlib.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111827;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
    }

    h1 { margin-top: 0; }

    #story {
      min-height: 240px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 16px;
      background: #030712;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input, button {
      padding: 12px;
      border-radius: 7px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
      color: #fff;
      background: #111827;
      border: 1px solid #4b5563;
    }

    button {
      cursor: pointer;
      color: #fff;
      background: #2563eb;
      border: 0;
    }

    button:hover { background: #1d4ed8; }
    button:disabled, input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #hint { color: #9ca3af; font-size: 0.9rem; }
  </style>
</head>

<body onload="brython()">
  <main>
    <h1>Point and Click: The Maze</h1>
    <p id="hint">Enter your choice below. Answers are case-insensitive.</p>

    <div id="story" role="log" aria-live="polite"></div>

    <form id="answer-form">
      <input id="answer" autocomplete="off"
             placeholder="Enter your choice..." autofocus>
      <button id="submit" type="submit">Submit</button>
    </form>
    <button id="restart" type="button" hidden>Play again</button>
  </main>

  <script type="text/python">
from browser import document, html, timer

story = document["story"]
answer = document["answer"]
form = document["answer-form"]
submit = document["submit"]
restart = document["restart"]

state = ""
finished = False


def say(message=""):
    story <= html.DIV(message)
    story.scrollTop = story.scrollHeight


def ask(message, next_state):
    global state
    say(message)
    state = next_state
    answer.value = ""
    answer.disabled = False
    submit.disabled = False
    answer.focus()


def end(message):
    global finished
    say(message)
    say("--- The End ---")
    finished = True
    answer.disabled = True
    submit.disabled = True
    restart.hidden = False


def normalize(value):
    value = value.strip().lower()
    if not value:
        return ""
    return value[0]


def start():
    global finished
    finished = False
    story.clear()
    restart.hidden = True
    say("Welcome to the maze.")
    ask("There are two doors. Which one do you choose? (Left / Right)", "door")


def handle(event):
    global state
    event.preventDefault()

    if finished:
        return

    choice = normalize(answer.value)

    if not choice:
        say("Please enter a choice.")
        return

    if state == "door":
        if choice == "l":
            say("You enter through the door. It locks.")
            say("You are now in a dark room with a skeleton and a door.")
            ask("Do you check out the skeleton or move to the next room? (Yes / No)", "skeleton")
        elif choice == "r":
            say("You enter through the door, but it locks behind you.")
            say("Inside this room is a button.")
            say("You look up and see a sign that says:")
            say("'If you entered through this door, you are going to need to be athletic to survive.'")
            ask("Do you press the button? (Yes / No)", "button")
        else:
            ask("Choose left or right.", "door")

    elif state == "skeleton":
        if choice == "y":
            ask("The skeleton has something in it. Do you search it? (Yes / No)", "search")
        elif choice == "n":
            say("You prevented your death.")
            say("You move on to the next room.")
            say("Inside there is a sign that reads: Two doors are death and one is safe.")
            say("You look down and see three doors: red, yellow, and orange.")
            ask("Which door do you choose? (Red / Yellow / Orange)", "color")
        else:
            ask("Choose yes or no.", "skeleton")

    elif state == "search":
        if choice == "y":
            end("You died.")
        elif choice == "n":
            say("You prevented your death.")
            say("You move on to the next room.")
            say("Inside there is a sign that reads: Two doors are death and one is safe.")
            say("You look down and see three doors: red, yellow, and orange.")
            ask("Which door do you choose? (Red / Yellow / Orange)", "color")
        else:
            ask("Choose yes or no.", "search")

    elif state == "color":
        if choice == "r" or choice == "o":
            end("Inside this door was a trap. You got shot by four arrows and died.")
        elif choice == "y":
            end("You walk through the door unharmed. You find the exit!")
        else:
            ask("Choose red, yellow, or orange.", "color")

    elif state == "button":
        if choice == "n":
            end("You do nothing and starve to death.")
        elif choice == "y":
            say("Suddenly, a secret hall opens and you enter it.")
            say("But then a boulder releases, so you run down the hall as it follows behind.")
            say("There are two paths: one is dark and the other is lit up.")
            ask("Which way do you go? (Dark / Bright)", "path")
        else:
            ask("Choose yes or no.", "button")

    elif state == "path":
        if choice == "b":
            end("The bright hallway was a trap and you died.")
        elif choice == "d":
            end("You escaped!")
        else:
            ask("Choose dark or bright.", "path")


form.bind("submit", handle)
restart.bind("click", lambda event: start())
start()
  </script>
</body>
</html>
