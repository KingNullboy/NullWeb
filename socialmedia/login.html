<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NullMedia</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <a href="../"><img class="logo" src="logo.png" alt="logo" width="40px"></a>
        <h1 id="pagetitle"><a href="subs.html">NullMedia</a></h1>
    </header>

    <center>
        <div id="form" style="margin-top: 50px; max-width: 400px;">
            <h2 style="font-family: 'Orbitron', sans-serif; color: var(--accent); margin-bottom: 20px;">SYSTEM ACCESS</h2>
            <input type="text" id="username" placeholder="Username" style="width: 100%; margin-bottom: 10px; padding: 10px; background: #000; border: 1px solid var(--border-color); color: white;">
            <input type="password" id="password" placeholder="Password" style="width: 100%; margin-bottom: 20px; padding: 10px; background: #000; border: 1px solid var(--border-color); color: white;">
            <button id="loginBtn" style="width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer;">AUTHENTICATE</button>
            <p id="loginError" style="color: red; margin-top: 15px; display: none;"></p>
        </div>
    </center>
</body>
</html>
