<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - NullMedia</title>
    <link rel="icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="../"><img class="logo" src="logo.png" alt="logo" width="40px"></a>
            <h1 id="pagetitle"><a href="subs.html">NullMedia</a></h1>
        </div>
        <nav>
            <ul class="nav__links">
                <button onclick="window.location.href='info.html';">Info</button>
                <button id="login">Login</button>
            </ul>
        </nav>
    </header>

    <main>
        <center>
            <div id="form">
                <div id="formatBtns">
                    <button onclick="addTags('**', '**', 2)" class="formatBtn"><b>B</b></button>
                    <button onclick="addTags('*', '*', 1)" class="formatBtn"><i>I</i></button>
                    <button onclick="addTags('<u>', '</u>', 3)" class="formatBtn">U</button>
                    <button onclick="addTags('```\n', '\n```', 4)" class="formatBtn">Code</button>
                    <button onclick="addTags('[', '](url)', 1)" class="formatBtn">Link</button>
                    <button onclick="addTags('> ', '', 2)" class="formatBtn">Quote</button>
                    
                    <input type="file" id="imageInput" style="display:none;" accept="image/*">
                    <button onclick="document.getElementById('imageInput').click()" class="formatBtn">Image</button>
                </div>

                <input type="text" id="title" placeholder="Title*">
                <textarea id="postContent" placeholder="Body (Markdown supported)"></textarea>
                
                <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                    <button id="submit">SUBMIT POST</button>
                    <button onclick="window.scrollTo(0, document.body.scrollHeight);" id="scrollBtn">BOTTOM</button>
                </div>
            </div>

            <div id="postsContainer"></div>
        </center>
    </main>
</body>
</html>
